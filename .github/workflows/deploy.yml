name: Deploy to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Production deployment
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - name: Check deployment configuration
        shell: bash
        run: |
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "Missing GitHub Actions secret or variable: $name" >&2
              exit 1
            fi
          done

      - name: Verify Vercel project access
        shell: bash
        run: |
          project_status="$(curl --silent --show-error \
            --output "$RUNNER_TEMP/vercel-project.json" \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID")"
          if [ "$project_status" != 200 ]; then
            echo "Vercel project lookup returned HTTP $project_status. Check the token scope and project/team IDs." >&2
            exit 1
          fi
          project_name="$(jq -r '.name // empty' "$RUNNER_TEMP/vercel-project.json")"
          project_org_id="$(jq -r '.accountId // empty' "$RUNNER_TEMP/vercel-project.json")"
          if [ "$project_name" != photos ] || [ "$project_org_id" != "$VERCEL_ORG_ID" ]; then
            echo "The Vercel project must be bsa-epfls-projects/photos." >&2
            exit 1
          fi
          team_status="$(curl --silent --show-error \
            --output "$RUNNER_TEMP/vercel-team.json" \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v2/teams/$VERCEL_ORG_ID")"
          if [ "$team_status" != 200 ]; then
            error_code="$(jq -r '.error.code // "unknown"' "$RUNNER_TEMP/vercel-team.json")"
            echo "Vercel team lookup returned HTTP $team_status ($error_code)." >&2
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Vercel CLI
        run: npm install --global vercel@64.0.2

      - name: Pull production configuration
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build production output
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Validate production output
        run: jq -e '.version == 3' .vercel/output/config.json >/dev/null

      - name: Deploy production output
        shell: bash
        run: |
          url="$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "Production deployment: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify live photo archive
        shell: bash
        run: |
          for attempt in {1..12}; do
            page="$(curl --fail --silent --show-error --max-time 10 https://photos.bsaepfl.ch/ || true)"
            if [[ "$page" == *'BSA Photos'* && "$page" == *'Browse BSA'* ]]; then
              echo "Live archive verified at https://photos.bsaepfl.ch/" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "The production domain does not show the photo archive yet." >&2
          exit 1
